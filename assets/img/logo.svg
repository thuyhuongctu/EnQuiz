<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EnQuiz">
  <!-- Logo EnQuiz, phong cách claymorphism (đất sét mềm, pastel): chữ Q với
       đuôi dấu tích, mỗi khối vẽ như đất nặn — gradient chéo sáng/tối mô
       phỏng độ cong, cộng một vệt sáng bóng ở góc trên-trái và một vệt tối
       mờ ở góc dưới-phải để lên khối 3D. Vẫn là vector: sắc nét từ favicon
       16px tới icon cài đặt 512px, nhẹ hơn mọi bản ảnh bệt. -->
  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF2E9"/>
      <stop offset=".55" stop-color="#F7E6F0"/>
      <stop offset="1" stop-color="#EBDCF5"/>
    </linearGradient>
    <!-- Khối clay của vòng chữ Q: hồng pastel sáng góc trên-trái, ngả tím
         hồng đậm hơn ở góc dưới-phải. -->
    <linearGradient id="lgRing" x1="0.08" y1="0.05" x2="0.92" y2="0.95">
      <stop offset="0" stop-color="#FFE9F2"/>
      <stop offset=".5" stop-color="#F6B9D8"/>
      <stop offset="1" stop-color="#E088B8"/>
    </linearGradient>
    <!-- Khối clay của đuôi dấu tích: vàng mơ sáng ngả cam san hô. -->
    <linearGradient id="lgTick" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#FFF2CE"/>
      <stop offset=".55" stop-color="#FFCB85"/>
      <stop offset="1" stop-color="#FF9E6D"/>
    </linearGradient>
    <linearGradient id="lgStar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4D2"/>
      <stop offset="1" stop-color="#FFC661"/>
    </linearGradient>
    <!-- Vệt bóng sáng đắp lên bề mặt clay, mờ dần ra ngoài. -->
    <linearGradient id="lgHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- Nền: tấm đất nặn pastel, bo tròn như mọi icon trong app -->
  <rect width="64" height="64" rx="15" fill="url(#lgBg)"/>
  <!-- Vệt sáng mặt nền, góc trên-trái, rất mờ — cho nền có độ nặn thay vì bẹt -->
  <ellipse cx="18" cy="14" rx="20" ry="12" fill="#FFFFFF" opacity=".25"/>

  <!-- Bóng đổ mềm dưới toàn bộ chữ, lệch xuống phải — khối chữ như đang nổi
       nhẹ trên nền, đúng tinh thần claymorphism. -->
  <g filter="url(#softShadow)" opacity=".28">
    <circle cx="31" cy="32.2" r="13" fill="none" stroke="#9B6B96" stroke-width="9"/>
    <path d="M26.6 33.6 L34.1 43.1 L52.1 23.1" fill="none" stroke="#9B6B96"
          stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Thân vòng chữ Q, khối clay chính -->
  <circle cx="30" cy="30" r="13" fill="none" stroke="url(#lgRing)" stroke-width="9"
          stroke-linecap="round"/>
  <!-- Vệt tối mặt dưới-phải của ống clay, cho cảm giác tròn khối -->
  <path d="M40.81 33.93 A 11.5 11.5 0 0 1 32.00 41.32" fill="none"
        stroke="#C9679F" stroke-width="2.6" stroke-linecap="round" opacity=".55"/>
  <!-- Vệt sáng bóng mặt trên-trái -->
  <path d="M18.68 28.00 A 11.5 11.5 0 0 1 28.00 18.68" fill="none"
        stroke="url(#lgHi)" stroke-width="3.1" stroke-linecap="round"/>

  <!-- Đuôi chữ Q vẽ thành dấu tích: bắt đầu trong lòng chữ, ra hẳn khỏi
       vòng tròn thì mới đọc ra là dấu tích chứ không phải cái móc. -->
  <path d="M26 33 L33.5 42.5 L51.5 22.5" fill="none" stroke="url(#lgTick)"
        stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vệt sáng dọc theo nhánh trên của dấu tích -->
  <path d="M35.3 40.4 L50 23.7" fill="none" stroke="url(#lgHi)"
        stroke-width="2.6" stroke-linecap="round" opacity=".9"/>

  <!-- Ngôi sao clay, đặt lệch để không chạm đuôi dấu tích -->
  <g filter="url(#softShadow)" opacity=".22">
    <path d="M50.4 8l1.75 3.66 4.02.56-2.93 2.81.72 3.98-3.56-1.9-3.56 1.9.72-3.98-2.93-2.81 4.02-.56z"
          fill="#9B6B96" transform="translate(0.8 0.8)"/>
  </g>
  <path d="M50.4 8l1.75 3.66 4.02.56-2.93 2.81.72 3.98-3.56-1.9-3.56 1.9.72-3.98-2.93-2.81 4.02-.56z"
        fill="url(#lgStar)"/>
  <circle cx="49" cy="9.6" r="1" fill="#FFFFFF" opacity=".75"/>
</svg>
